.fz *{box-sizing:border-box;}
.fz{
  --bg:#E7EBEC; --sup:#FFFFFF; --ink:#152329; --sec:#61757C; --line:#D6DDDF;
  --peso:#0E6E6E; --dolar:#8A6A22; --gasto:#B2463B; --ingreso:#2C7A5B;
  font-family:'Familjen Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:76px;
  -webkit-font-smoothing:antialiased;
}
.fz .num{font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.fz header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.fz h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;flex:1;}
.fz .wrap{padding:16px;max-width:560px;margin:0 auto;}
.fz .card{background:var(--sup);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.fz .tit{font-size:13px;color:var(--sec);margin:0 0 10px;font-weight:500;}
.fz .big{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;}
.fz .sub{font-size:13px;color:var(--sec);line-height:1.45;}
.fz .row{display:flex;gap:10px;}
.fz .grow{flex:1;min-width:0;}
.fz label{display:block;font-size:12px;color:var(--sec);margin:0 0 5px;}
.fz input,.fz select,.fz textarea{
  width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);appearance:none;
}
.fz textarea{font-size:14px;line-height:1.6;min-height:150px;resize:vertical;}
.fz input:focus,.fz select:focus,.fz textarea:focus{outline:2px solid var(--peso);outline-offset:-1px;border-color:transparent;}
.fz .field{margin-bottom:12px;}
.fz button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.fz button:disabled{opacity:.38;cursor:default;}
.fz .btn{background:var(--ink);color:#fff;padding:13px;border-radius:11px;width:100%;font-size:15px;font-weight:500;}
.fz .btn:active{transform:scale(.99);}
.fz .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.fz .btn.mini{padding:8px 12px;width:auto;font-size:13px;border-radius:9px;}
.fz .chips{display:flex;flex-wrap:wrap;gap:6px;}
.fz .chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.fz .chips.scroll::-webkit-scrollbar{display:none;}
.fz .chips.scroll .chip{flex:none;}
.fz .chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--sec);}
.fz .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.fz .seg{display:flex;background:#DDE3E5;border-radius:11px;padding:3px;gap:3px;}
.fz .seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;color:var(--sec);}
.fz .seg button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(21,35,41,.09);}
.fz nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;padding:8px 4px calc(14px + env(safe-area-inset-bottom));}
.fz nav button{flex:1;font-size:10.5px;letter-spacing:-.01em;color:var(--sec);display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;}
.fz nav button.on{color:var(--ink);font-weight:600;}
.fz nav .dot{width:20px;height:3px;border-radius:2px;background:transparent;}
.fz nav button.on .dot{background:var(--ink);}
.fz .mov{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;}
.fz .mov:last-child{border-bottom:none;}
.fz .marca{width:5px;height:34px;border-radius:3px;flex:none;}
.fz .leg{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;}
.fz .sw{width:9px;height:9px;border-radius:3px;flex:none;}
.fz .barra{height:9px;background:#DDE3E5;border-radius:5px;overflow:hidden;}
.fz .barra i{display:block;height:100%;border-radius:5px;}
.fz .vacio{text-align:center;padding:26px 8px;color:var(--sec);font-size:14px;line-height:1.6;}
.fz .modal{position:fixed;inset:0;background:rgba(21,35,41,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.fz .hoja{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:88vh;overflow:auto;}
.fz table{width:100%;border-collapse:collapse;font-size:13px;}
.fz td,.fz th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;}
.fz th{color:var(--sec);font-weight:500;font-size:11.5px;}
.fz .hair{border-top:1px solid var(--line);margin:14px 0;}
.fz .kpi{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.fz .kpi>div{flex:1;background:var(--sup);padding:11px 12px;min-width:0;}
.fz .kpi .v{font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;}
.fz .pos{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.fz .pos:last-of-type{border-bottom:none;}
.fz .tick{font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
.fz .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#EDF1F2;color:var(--sec);margin-left:6px;vertical-align:1px;}
.fz .up{color:var(--ingreso);} .fz .down{color:var(--gasto);}
.fz .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#DDE3E5;}
.fz .stack i{display:block;height:100%;}
.fz .rf{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.fz .rf.fin{border-style:dashed;}
.fz .err{color:var(--gasto);}
.fz .mini{font-size:12px;color:var(--sec);}
@media (prefers-reduced-motion: reduce){.fz *{transition:none !important;}}
